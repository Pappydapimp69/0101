<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="build" content="95b4a34">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0101 — House Sim</title>
<style>
  :root {
    --panel: rgba(20, 24, 28, 0.82); --panel-solid: #1c2227; --text: #eef1f4; --muted: #9aa5b1;
    --line: rgba(255,255,255,0.10); --good: #5cc46b; --warn: #e6b333; --bad: #e0574a; --accent: #6aa8ff;
    --pad: max(10px, env(safe-area-inset-left)); --pad-r: max(10px, env(safe-area-inset-right));
    --pad-t: max(8px, env(safe-area-inset-top)); --pad-b: max(10px, env(safe-area-inset-bottom));
    --tap: 34px;
  }
  @media (pointer: coarse) { :root { --tap: 42px; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #1b1f1a; color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .label { position: absolute; left: 0; top: 0; padding: 2px 7px; border-radius: 10px; background: rgba(0,0,0,0.55);
    font-size: 12px; white-space: nowrap; }
  .label-player { color: #9cc4ff; } .label-npc { color: #ffc58a; } .label-dog { color: #e8cf9a; }
  button { font: inherit; color: var(--text); cursor: pointer; border: 1px solid var(--line); background: #2a3239;
    border-radius: 999px; min-height: var(--tap); padding: 0 12px; }
  button:hover:not(:disabled) { background: #36414b; }
  button.on { background: var(--accent); color: #0b1320; border-color: transparent; }
  button:disabled { opacity: 0.45; cursor: default; }
  .glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* --- top bar: one row, never taller than a button --- */
  #top { position: fixed; top: var(--pad-t); left: var(--pad); right: var(--pad-r); display: flex; gap: 8px;
    align-items: center; justify-content: space-between; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #me { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 6px; border-radius: 999px; }
  #me .face { font-size: 20px; width: 26px; text-align: center; }
  .rings { display: flex; gap: 4px; }
  .ring { --v: 50; --c: var(--good); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--c) calc(var(--v) * 1%), rgba(255,255,255,0.13) 0); transition: opacity .4s, transform .4s; }
  .ring::before { content: attr(data-icon); width: 20px; height: 20px; border-radius: 50%; background: #1c2227;
    display: grid; place-items: center; font-size: 11px; }
  .ring { position: relative; }
  .ring.quiet { opacity: 0.5; transform: scale(0.86); }
  /* trend arrow on each ring: green ▲ rising, red ▼ falling */
  .ring[data-trend="up"]::after, .ring[data-trend^="down"]::after { position: absolute; right: -4px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%;
    display: grid; place-items: center; font-size: 8px; line-height: 1; background: #1c2227; border: 1px solid var(--line); }
  .ring[data-trend="up"]::after { content: '▲'; color: var(--good); }
  .ring[data-trend="down"]::after { content: '▼'; color: #c9a27a; }
  .ring[data-trend="down-fast"]::after { content: '▼'; color: var(--bad); border-color: var(--bad); }
  .ring.quiet[data-trend="up"] { opacity: 0.9; }
  .t { font-style: normal; font-size: 11px; width: 12px; text-align: center; }
  .t.up { color: var(--good); } .t.down, .t.down-soft { color: #c9a27a; } .t.down-fast { color: var(--bad); }
  #mood-trend { margin-left: -4px; }
  .eta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .eta.down-fast { color: #e39a90; } .eta.up { color: #8fd69a; }
  .ring.alert { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  #clockpill { display: flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; }
  #clock { font-weight: 600; padding: 0 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #scale { color: var(--warn); font-weight: 600; font-size: 12px; padding-right: 6px; }
  #clockpill button { min-width: var(--tap); padding: 0 8px; }
  #morebtn { width: var(--tap); padding: 0; font-size: 18px; }
  #me, #morebtn { flex-shrink: 0; }
  #clockpill { min-width: 0; }

  /* --- right column chips --- */
  #side { position: fixed; top: calc(var(--pad-t) + var(--tap) + 14px); right: var(--pad-r); display: flex;
    flex-direction: column; align-items: flex-end; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 0 10px; font-size: 13px;
    background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .chip .badge:empty { display: none; }
  .chip .badge { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 12px; font-weight: 600; }
  .chip.warn { border-color: var(--warn); }

  /* --- detail sheet (one at a time) --- */
  #sheet { position: fixed; z-index: 5; top: calc(var(--pad-t) + var(--tap) + 14px); left: var(--pad);
    width: min(320px, calc(100vw - var(--pad) - var(--pad-r))); max-height: calc(100dvh - var(--pad-t) - var(--pad-b) - 140px);
    overflow: auto; padding: 12px 14px; border-radius: 14px; }
  #sheet h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #sheet h3 button { min-height: 28px; padding: 0 10px; }
  #sheet h4 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: grid; grid-template-columns: 78px 1fr 26px 12px; gap: 8px; align-items: center; margin: 5px 0; }
  .row b { font-weight: 500; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .row.here span { color: var(--accent); font-weight: 600; }
  .bar { height: 8px; background: rgba(255,255,255,0.09); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .kv { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); margin: 4px 0; }
  .kv span { color: var(--text); text-align: right; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .log div { color: var(--muted); margin: 3px 0; font-size: 13px; } .log time { color: #6f7a86; margin-right: 4px; }
  .week { display: flex; gap: 4px; }
  .week span { flex: 1; text-align: center; font-size: 12px; padding: 4px 0; border-radius: 6px; color: var(--muted); background: rgba(255,255,255,0.05); }
  .week span.on { background: rgba(106, 168, 255, 0.22); color: var(--text); }
  .week span.today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bill { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .bill small { grid-column: 1; color: var(--muted); font-size: 12px; }
  .bill b { font-variant-numeric: tabular-nums; }
  .bill button { grid-row: 1 / span 2; grid-column: 3; min-height: 30px; }
  .bill.paid { opacity: 0.5; }
  .late { color: var(--bad); font-weight: 600; }
  .plan div { display: grid; grid-template-columns: 76px 1fr; gap: 6px; color: var(--muted); font-size: 13px; padding: 2px 6px; border-radius: 6px; }
  .plan time { font-variant-numeric: tabular-nums; }
  .plan .now { color: var(--text); background: rgba(106, 168, 255, 0.18); font-weight: 600; }
  .legend { color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 10px; } .legend b { color: var(--text); }

  /* --- bottom: toast + action bar (thumb zone) --- */
  #bottom { position: fixed; left: 50%; transform: translateX(-50%); bottom: var(--pad-b); display: flex; flex-direction: column;
    align-items: center; gap: 8px; width: min(560px, calc(100vw - var(--pad) - var(--pad-r))); pointer-events: none; }
  #bottom > * { pointer-events: auto; }
  #toast { padding: 6px 12px; border-radius: 12px; font-size: 13px; text-align: center; transition: opacity .5s; }
  #toast.gone { opacity: 0; pointer-events: none; }
  #actions { display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 999px; max-width: 100%; }
  #actions .doing { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #actions .doing b { color: var(--text); font-weight: 600; }

  #menu { position: fixed; z-index: 10; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 5px;
    min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
  #menu h4 { margin: 3px 8px 5px; font-size: 12px; color: var(--muted); }
  #menu button { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; background: transparent; padding: 0 10px; }
  #menu button:hover:not(:disabled) { background: #2f3843; }
  body.pad #menu button.focus { background: #3a4a5e; outline: 2px solid #ffd34d; outline-offset: -2px; }
  /* speech bubbles over heads */
  #bubbles { position: fixed; inset: 0; pointer-events: none; }
  .bubble { position: absolute; left: 0; top: 0; max-width: 180px; padding: 6px 10px; border-radius: 14px; background: #fbfaf6; color: #1b1f1a;
    font-size: 13px; line-height: 1.3; box-shadow: 0 3px 10px rgba(0,0,0,.35); transition: opacity .25s; white-space: normal; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fbfaf6; }
  .bubble.you { background: #dce9ff; } .bubble.you::after { border-top-color: #dce9ff; }
  /* chat wheel: 8 fixed slots around a countdown ring */
  #wheel { position: fixed; left: 50%; bottom: calc(var(--pad-b) + var(--tap) + 24px); width: 290px; height: 290px; margin-left: -145px; pointer-events: none; }
  #wheel-ring button { position: absolute; width: 66px; height: 50px; margin: -25px 0 0 -33px; border-radius: 16px; padding: 2px 4px; pointer-events: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; line-height: 1.1;
    background: var(--panel-solid); border: 1px solid var(--line); }
  #wheel-ring button .i { font-size: 18px; }
  #wheel-ring button.locked { opacity: .55; }
  #wheel-ring button.focus { outline: 2px solid #ffd34d; outline-offset: 1px; }
  #wheel-ring button.picked { border-color: var(--accent); }
  #wheel-center { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; display: grid; place-items: center; }
  #wheel-timer { position: absolute; inset: 0; border-radius: 50%; --p: 1;
    background: conic-gradient(var(--accent) calc(var(--p) * 360deg), rgba(255,255,255,.14) 0);
    -webkit-mask: radial-gradient(circle, transparent 29px, #000 30px); mask: radial-gradient(circle, transparent 29px, #000 30px); }
  #wheel-time { position: relative; font-size: 12px; font-weight: 600; text-align: center; background: var(--panel-solid); border-radius: 50%;
    width: 56px; height: 56px; display: grid; place-items: center; line-height: 1.15; }
  @media (max-height: 640px) { #wheel { transform: scale(.82); transform-origin: 50% 100%; } }
  #focus { position: fixed; left: 0; top: 0; pointer-events: none; padding: 3px 8px; border-radius: 10px;
    background: rgba(255, 211, 77, 0.95); color: #1b1f1a; font-weight: 600; font-size: 12px; white-space: nowrap; }

  @media (max-width: 400px) {
    #speed { display: none; } .rings { gap: 2px; }
    .ring { width: 22px !important; height: 22px !important; } .ring::before { width: 16px !important; height: 16px !important; font-size: 10px; }
    #me { gap: 4px; padding: 3px 6px 3px 4px; }
  }
  @media (max-width: 520px) {
    .ring { width: 24px; height: 24px; } .ring::before { width: 18px; height: 18px; }
    #me .face { font-size: 18px; width: 22px; }
    #clock { padding: 0 4px; font-size: 13px; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>

<div id="top">
  <button id="me" class="glass" title="Your needs" aria-label="Your needs"><span class="face">🙂</span><em id="mood-trend" class="t"></em><span class="rings" id="me-rings"></span></button>
  <div id="clockpill" class="glass">
    <button id="pause" title="Pause (Space)" aria-label="Pause">⏸</button>
    <span id="clock">8:00 AM</span><span id="scale"></span>
    <button id="speed" title="Speed (1/2/3)">1×</button>
  </div>
  <button id="morebtn" class="glass" title="Menu" aria-label="Menu">⋯</button>
</div>

<div id="side">
  <button id="sam" class="chip"><span id="sam-face">🙂</span> Sam <span class="badge"></span></button>
  <button id="dog" class="chip">🐶 Biscuit <span class="badge"></span></button>
  <button id="money" class="chip">💵 <span id="money-amt"></span> <span class="badge"></span></button>
  <button id="rooms" class="chip">🧹 <span id="room-name"></span> <span class="badge"></span></button>
</div>

<div id="sheet" class="glass" hidden></div>

<div id="bottom">
  <div id="toast" class="glass gone"></div>
  <div id="actions" class="glass">
    <button id="phone" title="Phone: social, time ×4">📱</button>
    <span class="doing" id="doing"></span>
    <button id="stop" hidden>Stop</button>
    <button id="drop" hidden>Put down</button>
  </div>
</div>

<div id="menu" hidden></div>
<div id="bubbles"></div>
<div id="wheel" hidden aria-label="Chat topics">
  <div id="wheel-ring"></div>
  <div id="wheel-center"><div id="wheel-timer"></div><span id="wheel-time"></span></div>
</div>
<div id="focus" hidden></div>
<script type="module" src="src/main.js?v=95b4a34"></script>
</body>
</html>
